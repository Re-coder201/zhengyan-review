    function answerFor(question,subject){
      const precise=manualLinks.find(([phrase])=>question.includes(phrase));
      if(precise){const linked=pointMap.get(precise[1]);if(linked)return {text:linked.answer,source:linked.bookTitle+' · '+linked.chapter+' · '+linked.title,pointId:linked.id}}
      const candidates=[...pointMap.values()].filter(p=>p.bookId===subject);
      const clean=question.replace(/[“”‘’、，。；：？（）()0-9A-Za-z]/g,'');
      const grams=[];for(let i=0;i<clean.length-1;i++)if(clean[i]!==clean[i+1])grams.push(clean.slice(i,i+2));
      let best=null,bestScore=-1;
      candidates.forEach(p=>{let s=0;grams.forEach(g=>{if(p.title.includes(g))s+=8;if(p.answer.includes(g))s+=.35});if(p.title.includes(clean.slice(0,5)))s+=20;if(s>bestScore){bestScore=s;best=p}});
      if(!best||bestScore<2)return {text:'请结合对应章节的知识框架作答：先界定概念，再分点说明理论依据、主要内容和方法论或现实意义。',source:'知识手册通用作答框架',pointId:null};
      return {text:best.answer,source:best.bookTitle+' · '+best.chapter+' · '+best.title,pointId:best.id};
    }

      return heading('智能练习','本轮复习题','先独立思考，再核对答案；完成后可回到对应资料复盘。',true)+'<section class="section-card review-card"><div class="review-meta"><span class="tag">'+esc(x.source)+'</span><span class="review-kind">'+(x.kind==='knowledge'?'知识点复习':'真题复习')+'</span></div><h2>'+esc(x.title)+'</h2><div class="review-prompt"><span>先在心里作答</span><button class="primary" data-reveal>显示参考答案</button></div><div id="reveal" hidden class="reveal">'+nl(x.answer)+'</div><div id="memory-row" class="memory-row" hidden><span class="memory-label">现在掌握得怎么样？</span><button class="memory" data-memory="yes">✓ 我记住了</button><button class="memory no" data-memory="no">还不熟</button></div><div id="jump-row" class="review-links"><span>需要回顾：</span>'+jumps+'</div><div id="feedback" class="feedback"></div></section></div>'
    }
    function renderSettings(){const theme=store.get('theme','violet'),font=store.get('font',16);return heading('PREFERENCES','设置','调整颜色、字号和本机学习记录。')+'<section class="section-card settings"><div class="setting"><div><strong>主题颜色</strong><p>立即应用到按钮、重点和进度条。</p></div><div class="theme-buttons"><button class="color '+(theme==='violet'?'active':'')+'" data-theme="violet" style="--swatch:#6658d8">紫罗兰</button><button class="color '+(theme==='blue'?'active':'')+'" data-theme="blue" style="--swatch:#2879cb">海蓝</button><button class="color '+(theme==='rose'?'active':'')+'" data-theme="rose" style="--swatch:#c95d82">玫瑰</button><button class="color '+(theme==='green'?'active':'')+'" data-theme="green" style="--swatch:#268b6a">松绿</button></div></div><div class="setting"><div><strong>正文字号</strong><p>拖动滑杆，阅读区会立即变化。</p></div><div class="font-control"><input id="font-size" type="range" min="14" max="22" step="1" value="'+font+'" aria-label="正文字号"><output class="font-value" id="font-value">'+font+' px</output></div></div><div class="setting"><div><strong>检查更新</strong><p id="update-state" class="update-state">当前版本 v'+APP_VERSION+'，尚未检查。</p></div><button class="primary alt" data-check-update>检查更新</button></div><div class="setting"><div><strong>本机学习记录</strong><p>收藏、评分、荧光笔和句旁批注仅保存在此浏览器。</p></div><button class="primary alt" data-clear-data>清除记录</button></div></section></div>'}
    function render(){const html=state.view==='read'?renderRead():state.view==='book'?renderBook():state.view==='chapter'?renderChapter():state.view==='point'?renderPoint():state.view==='exam'?renderExam():state.view==='favorites'?renderFavorites():['review','reviewChoose','reviewQuestion'].includes(state.view)?renderReview():renderSettings();app.innerHTML=html;nav.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===(['book','chapter','point'].includes(state.view)?'read':['review','reviewChoose','reviewQuestion'].includes(state.view)?'review':state.view)));bind()}
    function back(){if(state.view==='book'){state.view='read'}else if(state.view==='chapter'){state.view='book'}else if(state.view==='point'){state.view='chapter'}else if(state.view==='exam'&&state.paper!==null){state.paper=null}else if(state.view==='exam'&&state.subject){state.subject=null}else if(state.view==='reviewChoose'){state.view='review'}else if(state.view==='reviewQuestion'){state.view='reviewChoose';state.reviewItem=null}else state.view='read';render()}
    function bind(){
      app.querySelectorAll('[data-back]').forEach(b=>b.onclick=back);
      app.querySelectorAll('[data-book]').forEach(b=>b.onclick=()=>{state.book=b.dataset.book;state.view='book';render()});
      app.querySelectorAll('[data-chapter]').forEach(b=>b.onclick=()=>{state.chapter=+b.dataset.chapter;state.view='chapter';render()});
      app.querySelectorAll('[data-point]').forEach(b=>b.onclick=()=>{state.point=b.dataset.point;state.focusPoint=null;state.view='point';render()});
      app.querySelectorAll('[data-subject]').forEach(b=>b.onclick=()=>{state.subject=b.dataset.subject;state.paper=null;state.highlightQuestion=null;render()});
      app.querySelectorAll('[data-paper]').forEach(b=>b.onclick=()=>{state.paper=+b.dataset.paper;state.highlightQuestion=null;render()});
      app.querySelectorAll('[data-save]').forEach(b=>b.onclick=e=>{e.stopPropagation();const [k,id]=b.dataset.save.split('|');toggleSaved(k,id)});
      app.querySelectorAll('[data-score]').forEach(b=>b.onclick=()=>{const [id,n]=b.dataset.score.split('|');setScore(id,+n)});
      app.querySelectorAll('[data-favtab]').forEach(b=>b.onclick=()=>{state.fav=b.dataset.favtab;render()});
      const editable=document.getElementById('editable-answer');
      if(editable){
        editable.oninput=()=>store.set('answer-'+state.point,editable.innerHTML);
        editable.onmouseup=editable.onkeyup=()=>{const s=window.getSelection(),t=s&&s.toString().trim();if(t&&editable.contains(s.anchorNode)){state.selectedQuote=t;const target=document.getElementById('quote-target');if(target)target.textContent='已选中： “'+t.slice(0,90)+(t.length>90?'…':'')+'”';}};
        app.querySelectorAll('[data-highlight-color]').forEach(b=>b.onclick=()=>{const s=window.getSelection(),t=s&&s.toString().trim();if(!t){alert('请先拖选要标记的文字。');return}document.execCommand('hiliteColor',false,b.dataset.highlightColor);store.set('answer-'+state.point,editable.innerHTML)});
        app.querySelector('[data-highlight-remove]').onclick=()=>{const s=window.getSelection(),t=s&&s.toString().trim();if(!t){alert('请先拖选需要取消荧光笔的文字。');return}document.execCommand('hiliteColor',false,'transparent');store.set('answer-'+state.point,editable.innerHTML)};
        app.querySelector('[data-capture-note]').onclick=()=>{const s=window.getSelection(),t=s&&s.toString().trim();if(!t){alert('请先在答案中拖选一句或几句话。');return}state.selectedQuote=t;document.getElementById('quote-target').textContent='已选中： “'+t.slice(0,90)+(t.length>90?'…':'')+'”';document.getElementById('note-text').focus()};
        app.querySelector('[data-clear-highlight]').onclick=()=>{if(confirm('将还原该知识点的原始答案，并清除你添加的荧光笔和编辑内容。是否继续？')){editable.innerHTML=nl(pointMap.get(state.point).answer);store.set('answer-'+state.point,editable.innerHTML)}};
        app.querySelector('[data-add-note]').onclick=()=>{const input=document.getElementById('note-text'),t=input.value.trim();if(!t){return}if(!state.selectedQuote){alert('请先选中答案中的一句或几句话，再保存批注。');return}store.set('notes-'+state.point,[...store.get('notes-'+state.point,[]),{quote:state.selectedQuote,text:t}]);state.selectedQuote='';render()};
        app.querySelectorAll('[data-delete-note]').forEach(b=>b.onclick=()=>{const n=store.get('notes-'+state.point,[]);n.splice(+b.dataset.deleteNote,1);store.set('notes-'+state.point,n);render()})
      }
      app.querySelectorAll('[data-answer-toggle]').forEach(b=>b.onclick=()=>{const panel=document.getElementById('answer-'+b.dataset.answerToggle),open=panel.hidden;panel.hidden=!open;b.textContent=open?'收起答案':'展开答案与依据'});
      app.querySelectorAll('[data-read-source]').forEach(b=>b.onclick=()=>{state.point=b.dataset.readSource;state.focusPoint=b.dataset.readSource;state.view='point';render()});
      app.querySelectorAll('[data-review-pool]').forEach(b=>b.onclick=()=>{state.reviewPool=b.dataset.reviewPool;state.view='reviewChoose';render()});
      app.querySelectorAll('[data-review-type]').forEach(b=>b.onclick=()=>{state.reviewType=b.dataset.reviewType;render()});
      app.querySelectorAll('[data-review-order]').forEach(b=>b.onclick=()=>{state.reviewOrder=b.dataset.reviewOrder;render()});
      const start=app.querySelector('[data-start-review]');
      if(start)start.onclick=()=>{
        let items=[];
        const allPoints=[...pointMap.values()].map(p=>({id:p.id,kind:'knowledge',title:p.title,answer:p.answer,source:p.bookTitle+' · '+p.chapter,pointId:p.id}));
        const allQs=allQuestions();
        if(state.reviewPool==='saved'){
          const s=saved();
          if(state.reviewType!=='question')items.push(...allPoints.filter(x=>s.knowledge.includes(x.id)));
          if(state.reviewType!=='knowledge')items.push(...allQs.filter(x=>s.question.includes(x.id)));
        }else{
          if(state.reviewType!=='question')items.push(...allPoints);
          if(state.reviewType!=='knowledge')items.push(...allQs);
        }
        if(!items.length){alert(state.reviewPool==='saved'?'这个分类里还没有收藏内容，请先收藏知识点或真题。':'暂时没有可复习内容。');return}
        const currentScores=store.get('score',{});
        if(state.reviewOrder==='weak')items.sort((a,b)=>(currentScores[a.id]||0)-(currentScores[b.id]||0));
        else if(state.reviewOrder==='strong')items.sort((a,b)=>(currentScores[b.id]||0)-(currentScores[a.id]||0));
        state.reviewItem=state.reviewOrder==='random'?weighted(items):items[0];state.view='reviewQuestion';render()
      };
      const reveal=app.querySelector('[data-reveal]');
      if(reveal)reveal.onclick=()=>{document.getElementById('reveal').hidden=false;document.getElementById('memory-row').hidden=false;reveal.hidden=true};
      app.querySelectorAll('[data-memory]').forEach(b=>b.onclick=()=>{
        const yes=b.dataset.memory==='yes',x=state.reviewItem,scores=store.get('score',{});
        scores[x.id]=yes?5:1;store.set('score',scores);
        const fb=document.getElementById('feedback');
        fb.innerHTML='<img src="mascot.jpg" alt=""><span>'+(yes?'太棒了！你又稳稳拿下一个知识点。':'没关系，再来一次就会更清楚。加油！')+'</span>';
        pop(yes?'太棒了，继续保持！':'加油，这一题已经加入重点复习。');
        setTimeout(()=>{state.reviewItem=null;state.view='reviewChoose';render()},720)
      });
      const toReading=app.querySelector('[data-jump-reading]');
      if(toReading)toReading.onclick=()=>{
        const x=state.reviewItem;
        if(!x.pointId){alert('这道题暂未找到可精确定位的知识点。');return}
        state.point=x.pointId;state.focusPoint=x.pointId;state.view='point';render()
      };
      const toPaper=app.querySelector('[data-jump-paper]');
      if(toPaper)toPaper.onclick=()=>{
        const x=state.reviewItem;state.subject=x.paper.subject;state.paper=papers.indexOf(x.paper);state.highlightQuestion=x.id;state.view='exam';render()
      };
      const focused=app.querySelector('.question.focus');
      if(focused)setTimeout(()=>focused.scrollIntoView({behavior:'smooth',block:'center'}),80);
      const font=document.getElementById('font-size');
      if(font){
        const applyFont=()=>{store.set('font',+font.value);document.documentElement.style.setProperty('--font-size',font.value+'px');document.getElementById('font-value').textContent=font.value+' px'};
        font.oninput=applyFont;font.onchange=applyFont;
        app.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>setTheme(b.dataset.theme));
        app.querySelector('[data-clear-data]').onclick=()=>{if(confirm('清除本浏览器的收藏、评分和备注吗？')){Object.keys(localStorage).filter(k=>k.startsWith('still-pol-')).forEach(k=>localStorage.removeItem(k));render()}};
        app.querySelector('[data-check-update]').onclick=checkUpdate
      }
    }
    function setTheme(theme){const palettes={violet:['#6658d8','#e9e7ff'],blue:['#2879cb','#e3f0ff'],rose:['#c95d82','#ffe7ef'],green:['#268b6a','#ddf5eb']},p=palettes[theme]||palettes.violet;store.set('theme',theme);document.documentElement.style.setProperty('--accent',p[0]);document.documentElement.style.setProperty('--accent-soft',p[1]);render()}
    async function checkUpdate(){const t=document.getElementById('update-state');t.className='update-state loading';t.textContent='正在检查更新…';try{await new Promise(r=>setTimeout(r,650));const remote=await fetch('version.json?'+Date.now()).then(r=>r.json());t.className='update-state ok';t.textContent=remote.version===APP_VERSION?'已经是最新版本 v'+APP_VERSION+' · 已完成检查 ✓':'发现新版本 '+remote.version+'，刷新页面即可更新。'}catch(e){t.textContent='暂时无法检查，请确认网络后重试。'}}
    const bubble=document.getElementById('bubble'), mascot=document.getElementById('mascot');let popTimer;function pop(msg){clearTimeout(popTimer);bubble.textContent=msg;bubble.classList.add('show');mascot.classList.remove('pulse');void mascot.offsetWidth;mascot.classList.add('pulse');popTimer=setTimeout(()=>{bubble.classList.remove('show');mascot.classList.remove('pulse')},1150)}mascot.onclick=()=>pop(['今天的你很认真！','一小步也是进步，继续吧！','加油，我在这里陪你复习。'][Math.floor(Math.random()*3)]);
    nav.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{state.view=b.dataset.nav;state.book=state.chapter=state.point=null;if(state.view==='exam'){state.subject=null;state.paper=null}if(state.view==='review')state.reviewItem=null;render()});
    setTheme(store.get('theme','violet'));document.documentElement.style.setProperty('--font-size',store.get('font',16)+'px');render();
  })();
  </script>
</body>
